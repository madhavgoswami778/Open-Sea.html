<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open Sea</title>
<style>
:root{
  --ui-bg:rgba(250,252,253,.78);--ui-fg:#0e2a38;--ui-line:rgba(14,42,56,.25);--accent:#0b7285;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--ui-bg:rgba(8,22,30,.78);--ui-fg:#dcecf2;--ui-line:rgba(220,236,242,.25);--accent:#5fd0e0}
}
:root[data-theme="dark"]{--ui-bg:rgba(8,22,30,.78);--ui-fg:#dcecf2;--ui-line:rgba(220,236,242,.25);--accent:#5fd0e0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:#9db9c9;font-family:Georgia,"Times New Roman",serif}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.panel{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:18px;flex-wrap:wrap;
  padding:10px 14px;background:var(--ui-bg);color:var(--ui-fg);border:1px solid var(--ui-line);border-radius:8px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:14px;max-width:calc(100% - 24px);box-sizing:border-box}
.panel label{display:flex;flex-direction:column;gap:4px}
.panel input{accent-color:var(--accent);width:140px}
.hint{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;color:#fff;font-size:15px;text-shadow:0 1px 6px rgba(0,0,0,.45);pointer-events:none}
@media (prefers-reduced-motion: reduce){canvas{cursor:default}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">Drag to look around, scroll or pinch to zoom</div>
<div class="panel">
  <label>Wave height<input id="amp" type="range" min="0.2" max="2" step="0.05" value="1"></label>
  <label>Wind speed<input id="spd" type="range" min="0.2" max="2.5" step="0.05" value="1"></label>
  <label>Sun height<input id="sun" type="range" min="0.05" max="0.9" step="0.01" value="0.3"></label>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var canvas=document.getElementById('c');
  var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(55,1,0.5,2000);

  var uni={
    uTime:{value:0},uAmp:{value:1},
    uSun:{value:new THREE.Vector3(0.5,0.3,-0.8).normalize()}
  };

  var skyFn='uniform vec3 uSun;'+
  'vec3 skyColor(vec3 d){'+
  ' float h=clamp(d.y,0.,1.);'+
  ' float s=uSun.y;'+
  ' vec3 top=mix(vec3(.10,.07,.25),vec3(.12,.34,.66),smoothstep(0.,.5,s));'+
  ' vec3 hor=mix(vec3(.95,.52,.30),vec3(.74,.84,.92),smoothstep(0.,.5,s));'+
  ' vec3 c=mix(hor,top,pow(h,.45));'+
  ' float k=max(dot(d,normalize(uSun)),0.);'+
  ' c+=vec3(1.,.82,.55)*(pow(k,900.)*3.+pow(k,10.)*.22);'+
  ' return c;}';

  // Sky dome
  var sky=new THREE.Mesh(new THREE.SphereGeometry(1500,32,16),new THREE.ShaderMaterial({
    side:THREE.BackSide,depthWrite:false,uniforms:uni,
    vertexShader:'varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:'varying vec3 vD;'+skyFn+'void main(){gl_FragColor=vec4(skyColor(normalize(vD)),1.);}'
  }));
  scene.add(sky);

  // Sea
  var geo=new THREE.PlaneGeometry(1600,1600,320,320);geo.rotateX(-Math.PI/2);
  var sea=new THREE.Mesh(geo,new THREE.ShaderMaterial({
    uniforms:uni,
    vertexShader:
    'uniform float uTime;uniform float uAmp;varying vec3 vP;varying vec3 vN;varying float vH;'+
    'void wave(vec4 w,vec3 p,inout vec3 off,inout vec3 T,inout vec3 B){'+
    ' vec2 d=normalize(w.xy);float k=6.2831853/w.w;float c=sqrt(9.8/k);'+
    ' float f=k*(dot(d,p.xz)-c*uTime);float s=w.z*uAmp;float a=s/k;'+
    ' T+=vec3(-d.x*d.x*s*sin(f),d.x*s*cos(f),-d.x*d.y*s*sin(f));'+
    ' B+=vec3(-d.x*d.y*s*sin(f),d.y*s*cos(f),-d.y*d.y*s*sin(f));'+
    ' off+=vec3(d.x*a*cos(f),a*sin(f),d.y*a*cos(f));}'+
    'void main(){'+
    ' vec3 p=position;vec3 off=vec3(0.);vec3 T=vec3(1.,0.,0.);vec3 B=vec3(0.,0.,1.);'+
    ' wave(vec4(1.,.3,.20,60.),p,off,T,B);'+
    ' wave(vec4(.6,1.,.16,31.),p,off,T,B);'+
    ' wave(vec4(-.4,.9,.12,17.),p,off,T,B);'+
    ' wave(vec4(.9,-.5,.08,9.),p,off,T,B);'+
    ' wave(vec4(-.8,-.6,.05,4.5),p,off,T,B);'+
    ' vec3 w=p+off;vP=w;vH=off.y;vN=normalize(cross(B,T));'+
    ' gl_Position=projectionMatrix*viewMatrix*vec4(w,1.);}',
    fragmentShader:
    'varying vec3 vP;varying vec3 vN;varying float vH;'+skyFn+
    'void main(){'+
    ' vec3 V=normalize(cameraPosition-vP);vec3 N=normalize(vN);'+
    ' if(dot(N,V)<0.)N=-N;'+
    ' vec3 R=reflect(-V,N);R.y=abs(R.y);'+
    ' float fr=.03+.97*pow(1.-max(dot(N,V),0.),5.);'+
    ' float day=smoothstep(0.,.4,uSun.y);'+
    ' vec3 deep=mix(vec3(0.,.02,.05),vec3(0.,.10,.18),day);'+
    ' vec3 shal=mix(vec3(0.,.07,.10),vec3(.02,.42,.46),day);'+
    ' vec3 body=mix(deep,shal,clamp(vH*.25+.45,0.,1.));'+
    ' vec3 col=mix(body,skyColor(R),fr);'+
    ' float foam=smoothstep(.62,.95,vH/(1.0+.0));'+
    ' foam*=smoothstep(.2,.9,1.-N.y+.55);'+
    ' col=mix(col,vec3(.92,.96,.98)*(.35+.65*day),clamp(foam,0.,1.)*.55);'+
    ' float dist=length(cameraPosition-vP);'+
    ' vec3 hz=skyColor(normalize(vec3(V.x*-1.,.02,V.z*-1.)));'+
    ' col=mix(col,hz,1.-exp(-dist*.0012));'+
    ' gl_FragColor=vec4(pow(col,vec3(.95)),1.);}'
  }));
  sea.frustumCulled=false;
  scene.add(sea);

  // Camera orbit
  var theta=0.6,phi=1.38,radius=38,target=new THREE.Vector3(0,1.5,0);
  var dragging=false,lx=0,ly=0,pts={},pinch=0,idle=0;
  function place(){
    phi=Math.max(0.9,Math.min(1.52,phi));radius=Math.max(8,Math.min(160,radius));
    camera.position.set(
      target.x+radius*Math.sin(phi)*Math.sin(theta),
      target.y+radius*Math.cos(phi)+2,
      target.z+radius*Math.sin(phi)*Math.cos(theta));
    camera.lookAt(target);
  }
  canvas.addEventListener('pointerdown',function(e){canvas.setPointerCapture(e.pointerId);pts[e.pointerId]=[e.clientX,e.clientY];lx=e.clientX;ly=e.clientY;dragging=true;idle=0;});
  canvas.addEventListener('pointermove',function(e){
    if(!pts[e.pointerId])return;
    pts[e.pointerId]=[e.clientX,e.clientY];
    var ids=Object.keys(pts);
    if(ids.length===2){
      var a=pts[ids[0]],b=pts[ids[1]],d=Math.hypot(a[0]-b[0],a[1]-b[1]);
      if(pinch)radius*=pinch/d;pinch=d;
    }else{
      theta-=(e.clientX-lx)*0.005;phi-=(e.clientY-ly)*0.004;lx=e.clientX;ly=e.clientY;
    }
    idle=0;
  });
  function up(e){delete pts[e.pointerId];pinch=0;if(!Object.keys(pts).length)dragging=false;}
  canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',function(e){e.preventDefault();radius*=1+e.deltaY*0.001;},{passive:false});

  // Controls
  var spd=1,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.getElementById('amp').oninput=function(e){uni.uAmp.value=+e.target.value;};
  document.getElementById('spd').oninput=function(e){spd=+e.target.value;};
  function setSun(h){uni.uSun.value.set(0.5,h,-0.8).normalize();}
  document.getElementById('sun').oninput=function(e){setSun(+e.target.value);};
  setSun(0.3);

  function resize(){
    var w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);
    camera.aspect=w/h;camera.updateProjectionMatrix();
  }
  addEventListener('resize',resize);resize();

  var clock=new THREE.Clock(),t=0;
  function loop(){
    var dt=Math.min(clock.getDelta(),0.05);
    t+=dt*spd*(reduce?0.25:1);uni.uTime.value=t;
    idle+=dt;if(!dragging&&idle>3&&!reduce)theta+=dt*0.04;
    place();
    renderer.render(scene,camera);
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
